<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>字幕助手设置</title>
<link rel="stylesheet" href="options.css"></head><body><main>
<h1>字幕助手设置</h1><p>网页字幕直接读取。配置 Supadata 后，启用与 YouTube Digest 相同的原生字幕服务；DeepSeek 用于翻译和概览。</p>
<form id="settings-form">
<section><h2>字幕服务</h2><label>Supadata API Key<input id="supadata-key" type="password" autocomplete="off" spellcheck="false"></label>
<p><a href="https://dash.supadata.ai/" target="_blank">打开 Supadata 控制台</a>。已有 Digest 配置时，可把同一账号的 Key 自行粘贴到这里，不用发送到聊天。</p>
<label>字幕语言优先级<select id="language"><option value="auto">跟随视频原语言</option><option value="zh">优先中文</option><option value="en">优先英文</option></select></label></section>
<section><h2>翻译与概览</h2><label>DeepSeek API Key<input id="deepseek-key" type="password" autocomplete="off" spellcheck="false"></label>
<label>模型<input id="ai-model" value="deepseek-flash" spellcheck="false"></label>
<p><a href="https://platform.deepseek.com/api_keys" target="_blank">打开 DeepSeek 控制台</a>。不需要 AI 翻译或概览时可留空。</p></section>
<section><h2>没有独立字幕时</h2><label>本机识别模式<select id="asr-profile"><option value="balanced">高质量 Turbo：兼顾准确率与速度</option><option value="fast">极速 Tiny：更快，错词更多</option></select></label>
<label class="check"><input id="auto-asr" type="checkbox">确认没有字幕后自动转写音频</label>
<label class="check"><input id="cloud-generation" type="checkbox">允许云端音频转写（Supadata 按视频时长计费）</label>
<p>网站限制读取字幕时会显示原因；“读取失败”不会被标记为“没有字幕”。云端转写默认关闭。</p></section>
<button type="submit">保存设置</button><span id="status" role="status"></span>
</form><p class="foot">Key 仅保存在这个浏览器的扩展本地存储，不写入源码、日志或聊天。</p></main><script type="module" src="options.js"></script></body></html>
