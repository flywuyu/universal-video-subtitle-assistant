name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: python -m compileall -q local_service
  native-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Windows native messaging host
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $source = Join-Path $PWD 'local_service/NativeHost.cs'
          $outputFile = Join-Path $PWD 'SubtitleNativeHost.exe'
          & $compiler /nologo /target:exe /reference:System.Web.Extensions.dll "/out:$outputFile" $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
